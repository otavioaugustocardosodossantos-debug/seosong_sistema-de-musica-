<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Usuário</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f5f7;
            color: #1f2937;
        }


        /* CONTAINER */

        .container {
            width: 100%;
            max-width: 520px;
        }


        /* HEADER */

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;

            font-size: 30px;
            font-weight: 700;

            color: #111827;
        }

        .header p {
            margin: 7px 0 0;

            color: #6b7280;
            font-size: 15px;
        }


        /* CARD */

        .card {
            background: white;

            padding: 32px;

            border-radius: 16px;

            box-shadow:
                0 4px 6px rgba(0, 0, 0, 0.03),
                0 10px 30px rgba(0, 0, 0, 0.06);
        }


        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 600;

            color: #374151;
        }


        input {
            width: 100%;

            height: 44px;

            padding: 0 13px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            outline: none;

            font-size: 14px;

            background: white;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }


        input:focus {
            border-color: #111827;

            box-shadow:
                0 0 0 3px rgba(17, 24, 39, 0.08);
        }


        input::placeholder {
            color: #9ca3af;
        }


        /* DUAS COLUNAS */

        .row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }


        /* BOTÃO */

        button {
            width: 100%;

            height: 46px;

            margin-top: 8px;

            border: none;
            border-radius: 8px;

            background: #111827;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }


        button:hover {
            background: #374151;
        }


        button:active {
            transform: scale(0.99);
        }


        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }


        /* MENSAGEM */

        #message {
            margin: 18px 0 0;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;

            display: none;
        }


        #message.success {
            display: block;

            background: #ecfdf5;
            color: #047857;
        }


        #message.error {
            display: block;

            background: #fef2f2;
            color: #b91c1c;
        }


        /* RESPONSIVO */

        @media (max-width: 550px) {

            .card {
                padding: 24px 20px;
            }

            .header h1 {
                font-size: 26px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

        }

    </style>

    <link rel="stylesheet" href="app.css">
    <script src="api.js"></script>
    <script src="app-shell.js" defer></script>
</head>


<body>

<div class="container">


    <div class="header">

        <h1>Cadastro de Usuário</h1>

        <p>
            Preencha os dados abaixo para cadastrar um novo usuário.
        </p>

    </div>


    <div class="card">

        <form id="userForm">


            <!-- NOME -->

            <div class="form-group">

                <label for="name">
                    Nome
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Digite o nome completo"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="exemplo@email.com"
                    required
                >

            </div>


            <!-- SENHA -->

            <div class="form-group">

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Digite uma senha"
                    required
                >

            </div>


            <!-- DATA + CEP -->

            <div class="row">


                <div class="form-group">

                    <label for="birthDate">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="birthDate"
                    >

                </div>


                <div class="form-group">

                    <label for="cep">
                        CEP
                    </label>

                    <input
                        type="text"
                        id="cep"
                        maxlength="8"
                        placeholder="00000000"
                    >

                </div>

            </div>


            <!-- FOTO -->

            <div class="form-group">

                <label for="photo">
                    URL da foto
                </label>

                <input
                    type="url"
                    id="photo"
                    placeholder="https://exemplo.com/foto.jpg"
                >

            </div>


            <!-- BOTÃO -->

            <button type="submit" id="submitButton">

                Cadastrar usuário

            </button>


        </form>


        <p id="message"></p>

    </div>

</div>


<script>

    const form = document.getElementById("userForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        // Desabilita botão enquanto envia
        submitButton.disabled = true;
        submitButton.textContent = "Cadastrando...";

        // Monta objeto (os nomes precisam bater com a entidade User do Java)
        const user = {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
            birthDate: emptyToNull(document.getElementById("birthDate").value),
            zipCode: emptyToNull(document.getElementById("cep").value.replace(/\D/g, "")),
            photo: emptyToNull(document.getElementById("photo").value)
        };

        try {

            const saved = await apiSend("/users", "POST", user);

            message.className = "success";
            message.textContent = "✓ Usuário cadastrado com sucesso! ID: " + saved.id;

            form.reset();

        } catch (error) {

            console.error(error);

            message.className = "error";
            message.textContent = "Não foi possível cadastrar o usuário: " + error.message;

        }

        submitButton.disabled = false;
        submitButton.textContent = "Cadastrar usuário";
    });
</script>


</body>

</html>
