<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Música - SeoSong</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            color: #1f2937;
        }

        .container { width: 100%; max-width: 600px; }

        .header { margin-bottom: 24px; }

        .header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            color: #111827;
        }

        .header p {
            margin: 7px 0 0;
            color: #6b7280;
            font-size: 15px;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow:
                0 4px 6px rgba(0,0,0,.03),
                0 10px 30px rgba(0,0,0,.06);
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        input:focus {
            border-color: #111827;
            box-shadow: 0 0 0 3px rgba(17,24,39,.08);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            height: 46px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background: #374151; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }

        #message {
            margin: 18px 0 0;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        #message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
        }

        #message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
        }

        @media (max-width: 550px) {
            .card { padding: 24px 20px; }
            .header h1 { font-size: 26px; }
            .row { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
    <link rel="stylesheet" href="app.css">
    <script src="api.js"></script>
    <script src="app-shell.js" defer></script>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Cadastro de Música</h1>
        <p>Cadastre uma nova música no SeoSong.</p>
    </div>

    <div class="card">

        <form id="songForm">

            <div class="form-group">
                <label for="name">Nome da música</label>
                <input type="text" id="name" placeholder="Ex.: Sparkle" required>
            </div>

            <div class="form-group">
                <label for="artistId">Artista</label>
                <select id="artistId" required>
                    <option value="">Carregando artistas...</option>
                </select>
                <p class="info" style="margin:6px 0 0;font-size:13px;color:#6b7280;">
                    Não está na lista? <a href="cadastro-artista.html">Cadastre o artista</a> primeiro.
                </p>
            </div>

            <div class="form-group">
                <label for="album">Álbum</label>
                <input type="text" id="album" placeholder="Ex.: Your Name">
            </div>

            <div class="row">

                <div class="form-group">
                    <label for="year">Ano</label>
                    <input type="number" id="year" placeholder="Ex.: 2016">
                </div>

                <div class="form-group">
                    <label for="duration">Duração (segundos)</label>
                    <input type="number" id="duration" placeholder="Ex.: 300">
                </div>

            </div>

            <div class="form-group">
                <label for="genre">Gênero</label>
                <input type="text" id="genre" placeholder="Ex.: J-Pop">
            </div>

            <div class="form-group">
                <label for="photo">URL da foto</label>
                <input type="url" id="photo" placeholder="https://exemplo.com/foto.jpg">
            </div>

            <button type="submit" id="submitButton">
                Cadastrar música
            </button>

        </form>

        <p id="message"></p>

    </div>

</div>

<script>

    const form = document.getElementById("songForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const artistSelect = document.getElementById("artistId");

    // Carrega os artistas no <select> (aceita ?artistId=X na URL para vir pré-selecionado)
    async function carregarArtistas() {
        try {
            const artists = await apiFetch("/artists");
            artists.sort((a, b) => (a.name || "").localeCompare(b.name || "", "pt-BR"));
            fillOptions(artistSelect, artists, a => a.name || `Sem nome (#${a.id})`, {
                placeholder: "Escolha o artista",
                empty: "Nenhum artista cadastrado",
                selected: new URLSearchParams(location.search).get("artistId")
            });
        } catch (e) {
            console.error(e);
            artistSelect.innerHTML = `<option value="">Erro ao carregar artistas</option>`;
            artistSelect.disabled = true;
        }
    }

    carregarArtistas();

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        submitButton.disabled = true;
        submitButton.textContent = "Cadastrando...";

        if (!artistSelect.value) {
            message.className = "error";
            message.textContent = "Escolha o artista da música.";
            submitButton.disabled = false;
            submitButton.textContent = "Cadastrar música";
            return;
        }

        const song = {
            name: document.getElementById("name").value.trim(),
            artist: {
                id: Number(artistSelect.value)
            },
            album: emptyToNull(document.getElementById("album").value),
            // Campo vazio vira null (antes virava 0, e a música ficava com "ano 0")
            year: numberOrNull(document.getElementById("year").value),
            duration: numberOrNull(document.getElementById("duration").value),
            genre: emptyToNull(document.getElementById("genre").value),
            photo: emptyToNull(document.getElementById("photo").value)
        };

        try {

            const savedSong = await apiSend("/songs", "POST", song);

            message.className = "success";
            message.textContent = "✓ Música cadastrada com sucesso! ID: " + savedSong.id;

            // Limpa o formulário mas mantém o artista, para cadastrar várias músicas dele em sequência
            const artistaAtual = artistSelect.value;
            form.reset();
            artistSelect.value = artistaAtual;

        } catch (error) {

            console.error(error);

            message.className = "error";
            message.textContent = "Não foi possível cadastrar a música: " + error.message;
        }

        submitButton.disabled = false;
        submitButton.textContent = "Cadastrar música";
    });
</script>

</body>
</html>
