spring.application.name=seosong

# Segredos ficam FORA deste arquivo. Duas formas de informar:
#   1) variáveis de ambiente (DB_PASSWORD, ANTHROPIC_API_KEY, ...)
#   2) um arquivo "secrets.properties" na raiz do projeto (já está no .gitignore).
#      Copie o secrets.properties.example e preencha.
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seosong}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8083

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# IA (Anthropic). A chave NUNCA deve ser escrita aqui.
llm.api.url=https://api.anthropic.com/v1/messages
llm.api.key=${ANTHROPIC_API_KEY:}
llm.api.model=${LLM_MODEL:claude-sonnet-4-6}
llm.api.connect-timeout-ms=10000
llm.api.read-timeout-ms=60000
