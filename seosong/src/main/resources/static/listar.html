<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuários</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .title h1 {
            margin: 0;
            font-size: 30px;
        }

        .title p {
            margin: 6px 0 0;
            color: #6b7280;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            background: #111827;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #374151;
        }

        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 15px 20px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            color: #6b7280;
            background: #f9fafb;
        }

        td {
            padding: 15px 20px;
            border-top: 1px solid #eeeeee;
            font-size: 14px;
        }

        tr:hover td {
            background: #fafafa;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: #e5e7eb;
        }

        .user-name {
            font-weight: 600;
            color: #111827;
        }

        .user-email {
            margin-top: 3px;
            color: #6b7280;
            font-size: 13px;
        }

        .id {
            color: #6b7280;
            font-weight: 600;
        }

        .date,
        .cep {
            color: #4b5563;
        }

        /* BOTÃO PERFIL */

        .profile-button {
            display: inline-block;

            padding: 8px 12px;

            border-radius: 7px;

            background: #111827;
            color: white;

            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            transition: background 0.2s;
        }

        .profile-button:hover {
            background: #374151;
        }

        .loading,
        .empty,
        .error {
            padding: 60px 20px;
            text-align: center;
        }

        .loading {
            color: #6b7280;
        }

        .empty {
            color: #6b7280;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 800px) {

            .container {
                padding: 25px 12px;
            }

            .header {
                align-items: flex-start;
                gap: 15px;
            }

            th,
            td {
                padding: 12px;
            }

            .hide-mobile {
                display: none;
            }
        }
    </style>
    <link rel="stylesheet" href="app.css">
    <script src="api.js"></script>
    <script src="app-shell.js" defer></script>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="title">
            <h1>Usuários</h1>
            <p id="counter">Carregando...</p>
        </div>

        <button onclick="loadUsers()">
            ↻ Atualizar
        </button>

    </div>

    <div class="card">

        <div id="content" class="loading-line">
            <span class="spinner"></span> Carregando usuários...
        </div>

    </div>

</div>


<script>

    async function loadUsers() {

        const content = document.getElementById("content");
        const counter = document.getElementById("counter");

        content.className = "loading-line";
        content.innerHTML = "<span class=\"spinner\"></span> Carregando usuários...";

        try {

            const users = await apiFetch("/users");

            renderUsers(users);

            counter.innerText =
                `${users.length} usuário${users.length !== 1 ? "s" : ""} cadastrado${users.length !== 1 ? "s" : ""}`;

        } catch (error) {

            console.error(error);

            counter.innerText = "";

            content.className = "error";

            content.innerHTML = `
                <strong>Erro ao carregar usuários</strong>
                <br><br>
                <small>${esc(error.message)}</small>
            `;
        }
    }


    function renderUsers(users) {

        const content = document.getElementById("content");

        if (!users || users.length === 0) {
            content.className = "empty";
            content.innerHTML = "Nenhum usuário cadastrado.";
            return;
        }

        const rows = users.map(user => {

            const name = user.name || "Sem nome";
            const email = user.email || "-";
            const fallback = "https://ui-avatars.com/api/?name=" + encodeURIComponent(name);
            const photo = user.photo || fallback;

            return `
                <tr>
                    <td>
                        <span class="id">#${esc(user.id)}</span>
                    </td>

                    <td>
                        <div class="user">
                            <img class="avatar" src="${esc(photo)}" alt="${esc(name)}" data-fallback="${esc(fallback)}">
                            <div>
                                <div class="user-name">${esc(name)}</div>
                                <div class="user-email">${esc(email)}</div>
                            </div>
                        </div>
                    </td>

                    <td class="date hide-mobile">
                        ${formatDate(user.birthDate)}
                    </td>

                    <td class="cep hide-mobile">
                        ${esc(user.zipCode || "-")}
                    </td>

                    <td>
                        <a class="profile-button" href="profile.html?id=${encodeURIComponent(user.id)}">
                            Visualizar perfil
                        </a>
                    </td>
                </tr>
            `;

        }).join("");

        content.className = "";

        content.innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuário</th>
                        <th class="hide-mobile">Nascimento</th>
                        <th class="hide-mobile">CEP</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows}
                </tbody>
            </table>
        `;
    }


    loadUsers();
</script>

</body>
</html>
