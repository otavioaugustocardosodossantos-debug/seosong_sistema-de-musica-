<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Artista - SeoSong</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f5f7;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;

            font-size: 30px;
            font-weight: 700;

            color: #111827;
        }

        .header p {
            margin: 7px 0 0;

            color: #6b7280;
            font-size: 15px;
        }

        .card {
            background: white;

            padding: 32px;

            border-radius: 16px;

            box-shadow:
                0 4px 6px rgba(0, 0, 0, 0.03),
                0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 600;

            color: #374151;
        }

        input,
        textarea {
            width: 100%;

            padding: 12px 13px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            outline: none;

            font-size: 14px;

            font-family: Arial, Helvetica, sans-serif;

            background: white;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        input {
            height: 44px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #111827;

            box-shadow:
                0 0 0 3px rgba(17, 24, 39, 0.08);
        }

        input::placeholder,
        textarea::placeholder {
            color: #9ca3af;
        }

        button {
            width: 100%;

            height: 46px;

            margin-top: 8px;

            border: none;
            border-radius: 8px;

            background: #111827;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }

        button:hover {
            background: #374151;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #message {
            margin: 18px 0 0;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;

            display: none;
        }

        #message.success {
            display: block;

            background: #ecfdf5;
            color: #047857;
        }

        #message.error {
            display: block;

            background: #fef2f2;
            color: #b91c1c;
        }

        @media (max-width: 550px) {

            .card {
                padding: 24px 20px;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>

    <link rel="stylesheet" href="app.css">
    <script src="api.js"></script>
    <script src="app-shell.js" defer></script>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>Cadastro de Artista</h1>

        <p>
            Cadastre um novo artista no SeoSong.
        </p>

    </div>

    <div class="card">

        <form id="artistForm">

            <!-- NOME -->

            <div class="form-group">

                <label for="name">
                    Nome do artista
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Ex.: YOASOBI"
                    required
                >

            </div>


            <!-- DATA DE FORMAÇÃO -->

            <div class="form-group">

                <label for="formationDate">
                    Data de formação
                </label>

                <input
                    type="date"
                    id="formationDate"
                >

            </div>


            <!-- DESCRIÇÃO -->

            <div class="form-group">

                <label for="description">
                    Descrição
                </label>

                <textarea
                    id="description"
                    maxlength="255"
                    placeholder="Conte um pouco sobre o artista..."
                ></textarea>

            </div>


            <!-- FOTO -->

            <div class="form-group">

                <label for="photo">
                    URL da foto
                </label>

                <input
                    type="url"
                    id="photo"
                    placeholder="https://exemplo.com/foto.jpg"
                >

            </div>


            <!-- BOTÃO -->

            <button type="submit" id="submitButton">

                Cadastrar artista

            </button>


        </form>


        <p id="message"></p>

    </div>

</div>


<script>

    const form = document.getElementById("artistForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        submitButton.disabled = true;
        submitButton.textContent = "Cadastrando...";

        // Monta o objeto Artist
        const artist = {
            name: document.getElementById("name").value.trim(),
            formationDate: emptyToNull(document.getElementById("formationDate").value),
            description: emptyToNull(document.getElementById("description").value),
            photo: emptyToNull(document.getElementById("photo").value)
        };

        try {

            const savedArtist = await apiSend("/artists", "POST", artist);

            message.className = "success";
            message.textContent = "✓ Artista cadastrado com sucesso! ID: " + savedArtist.id;

            form.reset();

        } catch (error) {

            console.error(error);

            message.className = "error";
            message.textContent = "Não foi possível cadastrar o artista: " + error.message;

        }

        submitButton.disabled = false;
        submitButton.textContent = "Cadastrar artista";
    });
</script>

</body>

</html>
